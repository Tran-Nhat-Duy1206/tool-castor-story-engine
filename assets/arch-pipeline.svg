  <rect class="c" x="448" y="300" width="166" height="74" filter="url(#s1)"/>
  <text class="nm" x="470" y="334">Bộ phản chiếu</text><text class="d" x="470" y="357">Gia tăng có cấu trúc</text>
  <rect class="c cg" x="650" y="300" width="200" height="74" filter="url(#s1)"/>
  <text class="nmg" x="672" y="334">Quyết toán trạng thái</text><text class="d" x="672" y="357">Ghi lại trạng thái chính thống sau kiểm định</text>

  <path class="ln" d="M500,198 C500,272 360,262 348,298"/>
