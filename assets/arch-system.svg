  <rect x="0" y="0" width="1040" height="600" fill="#fdf8ec" rx="18"/>
  <text class="t3" x="44" y="56">Hệ thống tổng thể</text>
  <rect x="46" y="68" width="58" height="3" rx="1.5" fill="#e76f51"/>
  <rect class="share" x="664" y="36" width="336" height="28" rx="14"/>
  <text class="d3" x="682" y="54">Chia sẻ nền tảng: Cấu hình mô hình · Định tuyến đa mô hình · Dịch vụ bìa / hình ảnh</text>

  <rect class="pill" x="150" y="92" width="170" height="46" filter="url(#s3)"/><text class="pl" x="200" y="120">Đối thoại Studio</text>
  <rect class="pill" x="345" y="92" width="150" height="46" filter="url(#s3)"/><text class="pl" x="395" y="120">Dòng lệnh</text>
  <rect class="pill" x="520" y="92" width="150" height="46" filter="url(#s3)"/><text class="pl" x="558" y="120">Bảng điều khiển</text>
  <rect class="pill" x="695" y="92" width="170" height="46" filter="url(#s3)"/><text class="pl" x="748" y="120">OpenClaw</text>

  <path class="ln3" d="M235,138 L 470,178"/>
  <path class="ln3" d="M420,138 L 500,178"/>
  <path class="ln3" d="M595,138 L 540,178"/>
  <path class="ln3" d="M780,138 L 570,178"/>

  <rect class="band" x="120" y="180" width="800" height="76" filter="url(#s3)"/>
  <text class="bandt" x="150" y="215">Mặt thực thi thống nhất</text>
  <text class="d3" x="150" y="239">Hành động trọng yếu xác nhận trước · Trạng thái hoàn tất từ kết quả công cụ thực · Sản phẩm có thể xem trước và chỉnh sửa</text>

  <path class="ln3" d="M380,256 L 320,294"/>
  <path class="ln3" d="M660,256 L 720,294"/>

  <rect class="c3" x="120" y="296" width="382" height="118" filter="url(#s3)"/>
  <text class="nm3k" x="146" y="330">Dây chuyền truyện dài / ngắn</text>
  <text class="d3" x="146" y="358">Hoạch định → Điều phối → Viết → Kiểm duyệt → Tu chỉnh → Quyết toán</text>
  <text class="d3" x="146" y="382">Đầu ra: Sách · Chương · Truyện ngắn · Bìa · Hồ sơ thẩm duyệt</text>
  <text class="d3" x="146" y="406">Trạng thái chính thống lưu dạng tệp có cấu trúc, có thể viết tiếp lâu dài</text>

  <rect class="c3" x="538" y="296" width="382" height="118" filter="url(#s3)"/>
  <text class="nm3k" x="564" y="330">Tuyến vận hành thế giới tương tác</text>
  <text class="d3" x="564" y="358">Thế giới mở / Tương tác rẽ nhánh · Khế ước thế giới · Thúc đẩy thời gian</text>
  <text class="d3" x="564" y="382">Hành động tự do hoặc lựa chọn bấm được, mỗi lượt ghi lại vào thế giới</text>
  <text class="d3" x="564" y="406">Trạng thái: Nhân vật · Vật phẩm · Bằng chứng · Quan hệ · Bảng · Hình minh họa</text>

  <path class="ln3g" d="M280,414 L 280,470"/>
  <path class="ln3g" d="M342,470 L 342,416"/>
  <text class="al3g" x="200" y="448">Lắp ráp ↑ / Ghi lại ↓</text>
  <path class="ln3g" d="M698,414 L 698,470"/>
  <path class="ln3g" d="M760,470 L 760,416"/>
  <text class="al3g" x="772" y="448">↑ Lắp ráp / ↓ Ghi lại</text>

  <rect class="mem" x="120" y="472" width="800" height="96" filter="url(#s3)"/>
  <text class="memt" x="150" y="508">Ký ức và ngữ cảnh · Cắm rút theo nhu cầu</text>
  <text class="d3" x="150" y="534">Lắp ráp truy xuất theo mức liên quan · Thường trú / Phân tầng nén được · Chỉ nén ngữ nghĩa khi gần chạm cửa sổ ngữ cảnh</text>
  <text class="d3" x="150" y="556">Trạng thái chính thống story/state · Hình chiếu đọc được story/*.md · Truy xuất trình tự story/memory.db</text>
